name: Tailwind Pattern Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-tailwind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci
      - name: Run tailwind pattern scan
        run: npm run lint:tailwind
