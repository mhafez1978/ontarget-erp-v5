name: Semgrep security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  semgrep:
    name: Run semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Run semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          # Use custom rules located in repository
          config: .semgrep/sql-injection.yml
